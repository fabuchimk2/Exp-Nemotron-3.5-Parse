# Usage:
#   GPU_PROFILE=a2000      docker compose up -d --build   # RTX A2000 host
#   GPU_PROFILE=rtxpro6000 docker compose up -d --build   # RTX PRO 6000 host
# or put GPU_PROFILE=... in .env (see .env.example).
services:
  nemotron-parse:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODEL_REVISION: ${MODEL_REVISION:-main}
      secrets:
        - hf_token
    image: nemotron-parse-vllm:${IMAGE_TAG:-0.26.0}
    env_file:
      - profiles/${GPU_PROFILE:?set GPU_PROFILE to a2000 or rtxpro6000}.env
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    ipc: host
    shm_size: 8gb
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]

secrets:
  hf_token:
    environment: HF_TOKEN
